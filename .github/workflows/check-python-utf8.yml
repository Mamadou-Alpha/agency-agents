name: Check Python UTF-8 IO

# Locale-dependent encodings crash on Windows while passing CI on Linux: Python
# text I/O without an explicit encoding falls back to the platform locale
# (cp1252 on Windows). check-hermes-config-rewrite.py shipped exactly this bug.
# This guard fails any Python text-I/O call that omits encoding=.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-python-utf8:
    name: python text IO encodings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run UTF-8 IO guard
        run: |
          chmod +x scripts/check-python-utf8.sh
          ./scripts/check-python-utf8.sh

      - name: Self-test the guard
        run: |
          chmod +x scripts/test-check-python-utf8.sh
          ./scripts/test-check-python-utf8.sh
